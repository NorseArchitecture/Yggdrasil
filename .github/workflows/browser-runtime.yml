name: Browser Runtime

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  browser-runtime:
    runs-on: ubuntu-latest
    # Deliberately non-additive: phase ceilings classify hangs; this is the hard ratchet for the whole gate.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Hosting.Web.Server references the WebAssembly client, which opts into native linking for the
      # HyperCast/HyperUuid archives (WasmBuildNative), so the build needs wasm-tools. Same step as the
      # shared ci-build-test.yml: the projects say which workloads they need.
      - name: Restore .NET workloads
        timeout-minutes: 5
        run: dotnet workload restore

      - name: Build browser hosts
        timeout-minutes: 5
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: |
          dotnet build tests/Hosting.Web.Server.Tests/Hosting.Web.Server.Tests.csproj -c Release -p:UseProjectReferences=false
          dotnet build tests/Hosting.Stories.Tests/Hosting.Stories.Tests.csproj -c Release -p:UseProjectReferences=false

      - name: Install Chromium
        timeout-minutes: 5
        shell: pwsh
        run: |
          $script = Get-ChildItem -Path . -Filter playwright.ps1 -Recurse |
            Where-Object FullName -Match '[\\/]bin[\\/]Release[\\/]' |
            Select-Object -First 1
          if ($null -eq $script) { throw 'Release build produced no playwright.ps1.' }
          & $script.FullName install --with-deps chromium
          if ($LASTEXITCODE -ne 0) { throw "Playwright install exited $LASTEXITCODE." }

      - name: Test browser hosts
        timeout-minutes: 5
        run: |
          dotnet test tests/Hosting.Web.Server.Tests/Hosting.Web.Server.Tests.csproj -c Release -p:UseProjectReferences=false --no-build -- --explicit only --filter-class "*.WebServerBrowserRuntimeSmokeTests" "*.LaneCompositionTests"
          dotnet test tests/Hosting.Stories.Tests/Hosting.Stories.Tests.csproj -c Release -p:UseProjectReferences=false --no-build -- --explicit only --filter-class "*.StoriesBrowserRuntimeSmokeTests"

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure-evidence
          path: '**/TestResults/playwright/**'
          if-no-files-found: ignore
          retention-days: 7
